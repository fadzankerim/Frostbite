{% extends 'base.html' %}{% load ui %}
{% block title %}Upravljanje{% endblock %}
{% block content %}
<section class="page-head"><h1>Odaberite društvo</h1></section>
<div class="grid">
  {% for c in clubs %}
    <a class="club-card" href="{% url 'panel:club' c.pk %}"><span class="club-icon">{% icon 'building-2' %}</span>
      <div><h3>{{ c.name }}</h3><p class="meta">{{ c.city }}</p></div>{% icon 'chevron-right' 'chev' %}</a>
  {% endfor %}
</div>
{% endblock %}
