{% load ui %}<div class="panel-head">
  <div>
    <p class="eyebrow">{% icon 'building-2' %}Upravljanje društvom</p>
    <h1>{{ club.name }}</h1>
  </div>
  <nav class="tabs">
    <a href="{% url 'panel:club' club.pk %}" class="{% if tab == 'overview' %}active{% endif %}">{% icon 'trending-up' %}Pregled</a>
    <a href="{% url 'panel:club_tours' club.pk %}" class="{% if tab == 'tours' %}active{% endif %}">{% icon 'mountain' %}Ture</a>
    <a href="{% url 'panel:members' club.pk %}" class="{% if tab == 'members' %}active{% endif %}">{% icon 'users' %}Članovi</a>
    <a href="{% url 'panel:guides' club.pk %}" class="{% if tab == 'guides' %}active{% endif %}">{% icon 'footprints' %}Vodiči</a>
    <a href="{% url 'panel:club_profile' club.pk %}" class="{% if tab == 'profile' %}active{% endif %}">{% icon 'settings' %}Profil</a>
  </nav>
</div>
