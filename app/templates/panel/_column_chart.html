{% load ui %}<figure class="chart">
  <figcaption class="chart-head">
    <div><h3>{{ title }}</h3>{% if subtitle %}<p class="meta">{{ subtitle }}</p>{% endif %}</div>
    {% if chart.peak and chart.peak.1 %}<span class="chart-peak">Najviše: <b>{{ chart.peak.1 }}{{ chart.unit }}</b> · {{ chart.peak.0 }}</span>{% endif %}
  </figcaption>
  <svg class="chart-svg" viewBox="0 0 {{ chart.w }} {{ chart.h }}" role="img" aria-label="{{ title }}">
    {% for t in chart.ticks %}
      <line class="grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ t.y }}" y2="{{ t.y }}"/>
      <text class="tick" x="{{ chart.left|add:'-8' }}" y="{{ t.y }}" text-anchor="end" dominant-baseline="middle">{{ t.label }}</text>
    {% endfor %}
    {% for b in chart.bars %}
      <g class="bar" tabindex="0">
        <title>{{ b.tip }}</title>
        <rect class="hit" x="{{ b.hit_x }}" y="0" width="{{ b.hit_w }}" height="{{ chart.base_y }}"/>
        {% if b.path %}<path d="{{ b.path }}"/>{% endif %}
        {% if b.show_label %}<text class="xlabel" x="{{ b.lx }}" y="{{ chart.label_y }}" text-anchor="middle">{{ b.label }}</text>{% endif %}
      </g>
    {% endfor %}
    <line class="baseline" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ chart.base_y }}" y2="{{ chart.base_y }}"/>
  </svg>
  <details class="chart-table"><summary>{% icon 'list-checks' %}Prikaži kao tabelu</summary>
    <table class="table"><thead><tr><th>Period</th><th>Vrijednost</th></tr></thead>
      <tbody>{% for b in chart.bars %}<tr><td>{{ b.label }}</td><td>{{ b.value }}{{ chart.unit }}</td></tr>{% endfor %}</tbody></table>
  </details>
</figure>
