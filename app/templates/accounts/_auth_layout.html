{% extends 'base.html' %}{% load static ui %}
{% block content %}
<div class="auth-shell">
  <aside class="auth-art" aria-hidden="true">
    <div class="aurora"></div>
    <div class="snow snow-1"></div><div class="snow snow-2"></div><div class="snow snow-3"></div>
    <svg class="auth-mountains" viewBox="0 0 600 360" preserveAspectRatio="xMidYMax slice">
      <path class="am am-far" fill="#3d6a55" d="M0 230 L80 170 L150 200 L240 110 L310 170 L390 120 L470 190 L540 150 L600 180 L600 360 L0 360 Z"/>
      <g fill="#eef3ef" class="am-snow">
        <path d="M222 127 L240 110 L258 126 L249 123 L240 131 L231 123 Z"/><path d="M374 134 L390 120 L406 133 L398 130 L390 137 L382 130 Z"/>
      </g>
      <path class="am am-mid" fill="#2c5240" d="M0 280 L110 220 L200 260 L300 200 L400 255 L500 215 L600 250 L600 360 L0 360 Z"/>
      <path class="am-route" pathLength="1" fill="none" stroke="#f2c94c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"
            d="M150 330 C190 300 230 290 250 260 S290 220 300 202"/>
      <path class="am am-front" fill="#1d3a2c" d="M0 320 L130 285 L260 310 L380 280 L500 305 L600 290 L600 360 L0 360 Z"/>
    </svg>
    <div class="auth-art-copy">
      <span class="auth-logo">{% icon 'mountain-snow' %}</span>
      <h2>{% block art_title %}{% endblock %}</h2>
      <p>{% block art_text %}{% endblock %}</p>
      <ul class="auth-points">{% block art_points %}{% endblock %}</ul>
    </div>
  </aside>
  <section class="auth-form-side">
    <div class="auth-form-inner">
      {% block form %}{% endblock %}
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/auth.js' %}" defer></script>{% endblock %}
