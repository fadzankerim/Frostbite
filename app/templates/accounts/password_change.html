{% extends 'base.html' %}{% load ui %}
{% block title %}Promjena lozinke{% endblock %}
{% block content %}
<div class="panel narrow">
  <span class="club-icon">{% icon 'lock' %}</span>
  <h1>Promjena lozinke</h1>
  <form method="post" novalidate class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-block">Promijeni lozinku</button>
  </form>
</div>
{% endblock %}
