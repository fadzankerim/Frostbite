{% extends 'base.html' %}{% load ui %}
{% block title %}Registracija društva{% endblock %}
{% block content %}
<div class="panel narrow">
  <span class="club-icon">{% icon 'tent' %}</span>
  <h1>Registracija društva</h1>
  <p class="lead">Nakon što sistemski administrator odobri zahtjev, postajete administrator društva.</p>
  <form method="post" novalidate class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-block">{% icon 'flag' %}Pošalji zahtjev</button>
  </form>
</div>
{% endblock %}
